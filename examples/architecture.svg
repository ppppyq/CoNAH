<svg xmlns="http://www.w3.org/2000/svg" width="2240" height="1120" viewBox="0 0 2240 1120" role="img" aria-labelledby="title desc"><title id="title">Communication-Native Agent Harnesses 当前工程架构</title><desc id="desc">横向四层：任务入口、智能体 Harness、平台接口、执行环境。任务 JSON 与运行配置经 CLI 装配。Harness 包括任务规则、模型适配、Session 执行循环、记忆状态和通用工具执行器。外部模型通过适配器调用。当前接通 HM3D-M3 与 Habitat；无人机、阿克曼小车、USRP 驱动为预留。底部通信模块已有旧多机 V0 理想消息网络，尚未接入当前单机流程；机器人、AP、基站独立 Harness 与真实通信约束为规划。</desc><rect x="0" y="0" width="2240" height="1120" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="40" y="68" fill="#17283E" font-size="44" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-weight="700" text-anchor="start">Communication-Native Agent Harnesses</text><text x="42" y="113" fill="#54657B" font-size="26" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-weight="400" text-anchor="start">当前工程架构  /  任务、方法与平台分离</text><text x="2196" y="110" fill="#54657B" font-size="19" font-family="Consolas, monospace" font-weight="400" text-anchor="end">LOCAL FRAMEWORK  ·  2026.11</text><rect x="40" y="156" width="280" height="70" rx="10" fill="#60952F" stroke="none" stroke-width="2" /><text x="180.0" y="201" fill="#FFFFFF" font-size="32" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-weight="700" text-anchor="middle">任务入口</text><rect x="40" y="242" width="280" height="650" rx="12" fill="#F1F7E9" stroke="none" stroke-width="2" /><rect x="350" y="156" width="1000" height="70" rx="10" fill="#237CDD" stroke="none" stroke-width="2" /><text x="850.0" y="201" fill="#FFFFFF" font-size="32" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-weight="700" text-anchor="middle">智能体 Harness</text><rect x="350" y="242" width="1000" height="650" rx="12" fill="#EEF5FE" stroke="none" stroke-width="2" /><rect x="1380" y="156" width="360" height="70" rx="10" fill="#465FD2" stroke="none" stroke-width="2" /><text x="1560.0" y="201" fill="#FFFFFF" font-size="32" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-weig